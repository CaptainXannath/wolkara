
name: Build Wolkara Debug IPA

on:
  workflow_dispatch:
  push:
    branches: [investigate/tact-70755-network, investigate/tact-70755-object]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test bounded TACT retrieval and owner diagnostics
        run: |
          bash tools/test_tact_network.sh
          bash tools/test_tact_object.sh
          bash tools/test_tact_cache.sh
          python3 -m unittest discover -s tests -p 'test_tact_metadata.py' -v
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iruntime runtime/GuestTactOwner.c tests/test_tact_owner.c -o /tmp/test_tact_owner
          /tmp/test_tact_owner
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iruntime tests/test_guest_diagnostics.c -o /tmp/test_guest_diagnostics
          /tmp/test_guest_diagnostics

      - name: Build experimental IPA
        run: |
          TOLKARA_SYSTEM_ROOTS=NO \
          tools/package_ipa.sh Wolkara-debug.ipa

      - name: Verify original sideload bundle identifier
        run: |
          unzip -p Wolkara-debug.ipa 'Payload/TolkaraDiagnostics.app/Info.plist' > /tmp/Wolkara-Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/Wolkara-Info.plist)" = local.tolkara.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-Debug-IPA
          path: Wolkara-debug.ipa

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-Build-Logs
          path: logs/

  regression:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Run required sanitizer regression suite
        run: bash tools/test_emulation.sh
      - name: Upload regression logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-Regression-Logs
          path: logs/
          if-no-files-found: ignore

  baseline-signing:
    # Reproduce the unchanged Local Signing failures on the same runner image.
    # Keep these checks visible; do not skip integrity assertions to get green CI.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 65b412d16b72f02b341016f2d1e3c7ca8551f0fc
      - name: Test unchanged baseline signing behavior
        run: python3 -m unittest tests.test_sign_guest_local -v
