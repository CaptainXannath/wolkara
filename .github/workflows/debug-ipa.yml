
name: Build Wolkara Debug IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build experimental IPA
        run: |
          TOLKARA_SYSTEM_ROOTS=NO \
          tools/package_ipa.sh Wolkara-debug.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-Debug-IPA
          path: Wolkara-debug.ipa

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-Build-Logs
          path: logs/
