name: Build & Release Wolkara IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional Git tag to create/publish a GitHub Release (e.g. v0.2.0)"
        required: false
        default: ""
      release_name:
        description: "Optional GitHub Release title (defaults to Wolkara <tag>)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master, feature/photo-hud]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: wolkara-ipa-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-ipa:
    name: Build Wolkara StikDebug IPA
    # Cross-build the arm64 IPA on Intel while macOS arm64 capacity is constrained.
    runs-on: macos-26-intel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode and check architecture
        run: |
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          uname -a

      - name: Ensure script permissions
        run: chmod +x tools/*.sh tools/*.py

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run localization and External JIT unit checks
        run: |
          bash tools/test_localization.sh
          bash tools/test_external_jit.sh

      - name: Build Wolkara StikDebug IPA
        env:
          TOLKARA_SYSTEM_ROOTS: "NO"
        run: bash tools/package_external_jit_ipa.sh Wolkara.ipa

      - name: Keep IPA build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-custom-hud-ipa-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify IPA
        run: |
          set -euo pipefail
          test -s Wolkara.ipa
          unzip -tq Wolkara.ipa
          PLIST_TMP=$(mktemp)
          trap 'rm -f "$PLIST_TMP"' EXIT
          unzip -p Wolkara.ipa "Payload/WolkaraExternalJIT.app/Info.plist" > "$PLIST_TMP"
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST_TMP")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_TMP")
          echo "Verified IPA metadata: display=$DISPLAY_NAME id=$BUNDLE_ID"
          [ "$DISPLAY_NAME" = "Wolkara" ]
          shasum -a 256 Wolkara.ipa > Wolkara.ipa.sha256

      - name: Upload Wolkara IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-IPA
          path: |
            Wolkara.ipa
            Wolkara.ipa.sha256
          if-no-files-found: error
          retention-days: 30

  simulator-tests:
    name: Touch HUD & Gamepad Simulator Tests
    runs-on: macos-26-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode and check architecture
        run: |
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          uname -a

      - name: Ensure script permissions
        run: chmod +x tools/*.sh tools/*.py

      - name: Run Touch HUD & Input Simulator Tests
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          candidates = [
              d for r, ds in json.load(sys.stdin)["devices"].items()
              if "iOS" in r
              for d in ds if "iPhone" in d["name"]
          ]
          candidates.sort(key=lambda d: (d["state"] != "Booted", "Pro Max" not in d["name"], d["name"]))
          print(candidates[0]["udid"] if candidates else "")
          ')
          [ -n "$SIM_ID" ] || { echo "No iPhone simulator available"; exit 1; }
          export SIMULATOR="$SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          mkdir -p logs logs/crash-reports
          failed=0
          run_log() {
            local label="$1" logfile="$2"
            shift 2
            echo "=== $label ==="
            if ! ("$@" 2>&1 | tee "$logfile"); then
              echo "::error::$label failed (see $logfile)"
              failed=1
            fi
          }
          run_log "test_touch_abilities" logs/test-touch-abilities.log bash tools/test_touch_abilities.sh
          run_log "test_direct_touch_camera" logs/test-direct-touch-camera.log bash tools/test_direct_touch_camera.sh
          run_log "test_touch_gamepad_ui --self-test" logs/test-gamepad-lifecycle.log bash tools/test_touch_gamepad_ui.sh --self-test
          run_log "test_touch_gamepad_ui --self-test-input" logs/test-gamepad-input.log bash tools/test_touch_gamepad_ui.sh --self-test-input
          run_log "test_touch_controls_ui --self-test" logs/test-controls.log bash tools/test_touch_controls_ui.sh --self-test
          run_log "test_touch_controls_ui --self-test --toolbar-test" logs/test-toolbar.log bash tools/test_touch_controls_ui.sh --self-test --toolbar-test

          if [ "$failed" -ne 0 ]; then
            echo "=== Collecting Simulator & Diagnostic Crash Logs ==="
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 \( -name '*.ips' -o -name '*.crash' \) -exec cp {} logs/crash-reports/ \; 2>/dev/null || true
            if [ -f "$HOME/Library/Logs/CoreSimulator/${SIM_ID}/system.log" ]; then
              tail -n 200 "$HOME/Library/Logs/CoreSimulator/${SIM_ID}/system.log" > logs/crash-reports/simulator-system-tail.log || true
            fi
            for f in logs/crash-reports/*; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              head -n 80 "$f" || true
            done
            exit 1
          fi

      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-custom-hud-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build-ipa, simulator-tests]
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out history for release notes
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Wolkara-IPA
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Wolkara ${TAG}"
            IS_PRE="false"
            case "$TAG" in *-*) IS_PRE="true" ;; esac
          else
            TAG="${{ inputs.release_tag }}"
            TITLE="${{ inputs.release_name }}"
            if [ -z "$TITLE" ]; then TITLE="Wolkara ${TAG}"; fi
            IS_PRE="${{ inputs.prerelease }}"
          fi

          SHA256=$(awk '{print $1}' release-assets/Wolkara.ipa.sha256)
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "HEAD^" 2>/dev/null || true)
          URL="${{ github.server_url }}/${{ github.repository }}"

          {
            echo "## Wolkara (${TAG})"
            echo
            echo "Built from commit \`${GITHUB_SHA}\` (Actions run [${GITHUB_RUN_ID}](${URL}/actions/runs/${GITHUB_RUN_ID})) with \`CFBundleDisplayName=Wolkara\` and bundle ID \`local.tolkara.app.externaljit\`."
            echo
            echo "- **Asset:** \`Wolkara.ipa\`"
            echo "- **SHA-256:** \`${SHA256}\`"
            echo
            echo "### Highlights"
            echo "- **Renamed to Wolkara** (retains bundle ID \`local.tolkara.app.externaljit\` so updating over an existing install preserves your Documents/WoW data)."
            echo "- **Collapsible Photo HUD**: Minimal dark/gold top-center \`⌄\` pill, clean bottom-left thumbstick (with optional **Left Stick: WASD** toggle), configurable right HUD controls (**Target**, **Interact**, **Jump**, **Camera**), and individual HUD visibility toggles."
            echo "- **PlayPort-Style Custom Buttons**: Drag \`⊕ Drag Button\` onto the canvas, customize per-button **Tap / Hold / Toggle** behavior, **Circle / Pill / Box** shapes, width stretch, 7 color presets, 3 switchable profiles, keyboard/mouse/gamepad bindings, and standalone sticky modifiers (\`Shift\`/\`Ctrl\`/\`Alt\`/\`Cmd\`)."
            echo
            echo "### Installation"
            echo "This IPA is ad-hoc signed without embedded credentials or provisioning profiles (\`TOLKARA_SYSTEM_ROOTS=NO\`). Re-sign it with development signing that preserves \`get-task-allow\`, then launch with StikDebug + LocalDevVPN."
            echo
            echo "- SideStore: \`sidestore://install?url=${URL}/releases/download/${TAG}/Wolkara.ipa\`"
            echo "- LiveContainer: \`livecontainer://install?url=${URL}/releases/download/${TAG}/Wolkara.ipa\`"
            if [ -n "$PREV" ]; then
              echo
              echo "### Commits since ${PREV}"
              git log --no-merges --format="- [\`%h\`](${URL}/commit/%H) %s" "${PREV}..HEAD" | head -n 100
            fi
          } > release-notes.md

          PRE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md $PRE_FLAG
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --target "${GITHUB_SHA}" --title "$TITLE" --notes-file release-notes.md $PRE_FLAG
          fi
          gh release upload "$TAG" release-assets/Wolkara.ipa release-assets/Wolkara.ipa.sha256 --clobber
