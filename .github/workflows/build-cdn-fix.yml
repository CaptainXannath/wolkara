name: Build Wolkara CDN repair IPA

on:
  workflow_dispatch:
  push:
    branches: [fix/forever-cdn-startup]
    paths:
      - .github/workflows/build-cdn-fix.yml
      - launcher/**
      - tests/**
      - tools/**

permissions:
  contents: read

concurrency:
  group: wolkara-cdn-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Test and build StikDebug IPA
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repair source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show source and toolchain
        run: |
          git log -1 --oneline
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run launcher regression tests
        run: |
          set -euo pipefail
          mkdir -p logs
          bash tools/test_wow_launcher.sh 2>&1 | tee logs/wow-launcher-tests.log

      - name: Build the StikDebug IPA
        env:
          TOLKARA_SYSTEM_ROOTS: "NO"
        run: bash tools/package_external_jit_ipa.sh Wolkara-stikdebug-cdn-repair.ipa

      - name: Test automatic repair before Play in the simulator
        run: |
          set -euo pipefail
          bash tools/test_wow_launcher_ui.sh --metadata-repair 2>&1 | tee logs/wow-metadata-ui-tests.log

      - name: Verify the IPA and record its checksum
        run: |
          set -euo pipefail
          test -s Wolkara-stikdebug-cdn-repair.ipa
          unzip -tq Wolkara-stikdebug-cdn-repair.ipa
          shasum -a 256 Wolkara-stikdebug-cdn-repair.ipa > Wolkara-stikdebug-cdn-repair.ipa.sha256
          {
            echo "Built source $(git rev-parse HEAD)"
            echo
            echo 'The IPA includes the automatic CDN metadata repair before Play.'
            echo 'Install it over Wolkara JIT with the same signing account and bundle ID to keep the existing game download.'
            echo 'Use development signing that preserves get-task-allow, then launch through StikDebug as before.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-StikDebug-CDN-repair-IPA
          path: |
            Wolkara-stikdebug-cdn-repair.ipa
            Wolkara-stikdebug-cdn-repair.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-CDN-repair-validation
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  emulation:
    name: Full emulation regression suite
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          bash tools/test_emulation.sh 2>&1 | tee logs/emulation-tests.log
      - name: Keep regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-CDN-repair-emulation-validation
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
